name: Compilar APK MiClio

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java 17 para Android
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Preparar proyecto Capacitor 6 y permisos GPS
        run: |
          mkdir -p www
          cp index.html www/
          if [ -f manifest.json ]; then cp manifest.json www/; fi
          if [ -f sw.js ]; then cp sw.js www/; fi
          
          # Si no existe capacitor.config.json, crea uno válido automáticamente
          if [ ! -f capacitor.config.json ]; then
            echo '{"appId":"com.francisco.miclionafta","appName":"MiClio Nafta","webDir":"www"}' > capacitor.config.json
          fi

          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          
          # Inyectar permisos de GPS y Segundo Plano en AndroidManifest.xml
          sed -i 's/<\/manifest>/<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/><uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" \/><uses-permission android:name="android.permission.FOREGROUND_SERVICE" \/><uses-permission android:name="android.permission.WAKE_LOCK" \/><\/manifest>/g' android/app/src/main/AndroidManifest.xml
          
          npx cap sync android

      - name: Compilar archivo APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: MiClio-Nafta-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
